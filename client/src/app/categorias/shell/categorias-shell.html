<main class="min-h-screen bg-[#e9eff0] text-[#173d46]">
  <app-navbar></app-navbar>

  <div class="relative mx-auto max-w-7xl px-5 py-8 sm:px-8 sm:py-12">
    <div
      class="pointer-events-none absolute right-5 top-0 hidden size-24 items-center justify-center sm:flex sm:right-8"
      aria-hidden="true"
    >
      <span class="absolute inset-0 rounded-[48%_0_0_52%] bg-[#dce9e9]/75"></span>
      <span class="absolute right-0 top-0 size-9 rounded-full bg-[#285f66]/10"></span>
      <svg
        lucideFolderOpen
        class="relative -translate-x-1 -rotate-6 size-14 text-[#285f66]/35"
        strokeWidth="1.5"
        aria-hidden="true"
      ></svg>
      <svg
        lucideTag
        class="absolute bottom-4 right-3 size-5 rotate-12 text-[#285f66]/50"
        strokeWidth="1.7"
        aria-hidden="true"
      ></svg>
    </div>
    <nav
      aria-label="Navegação de categorias"
      class="mb-6 flex flex-wrap gap-2 border-b border-[#d5e0e3] pb-4"
    >
      <a
        routerLink="/categorias/listar"
        routerLinkActive="bg-[#dce9e9] text-[#285f66]"
        ariaCurrentWhenActive="page"
        class="rounded-lg px-4 py-2 text-sm font-semibold text-[#64748b] transition-colors hover:bg-white/70 hover:text-[#285f66] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#285f66]"
        >Minhas categorias</a
      >
      <a
        routerLink="/categorias/cadastrar"
        routerLinkActive="bg-[#dce9e9] text-[#285f66]"
        ariaCurrentWhenActive="page"
        class="rounded-lg px-4 py-2 text-sm font-semibold text-[#64748b] transition-colors hover:bg-white/70 hover:text-[#285f66] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#285f66]"
        >Cadastrar categoria</a
      >
    </nav>
    <router-outlet></router-outlet>
  </div>
</main>
