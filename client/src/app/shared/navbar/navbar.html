<header class="border-b border-slate-200 bg-white">
  <div
    class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-3 px-5 py-4 sm:px-8"
  >
    <a
      routerLink="/"
      class="inline-flex items-center gap-3 rounded-lg text-lg font-semibold tracking-tight text-slate-950"
    >
      <span
        class="grid size-10 place-items-center rounded-xl bg-brand-700 text-brand-300"
        aria-hidden="true"
        >N</span
      >
      NoteKeeper
    </a>

    <span class="flex gap-2">
      @if (sessaoAutenticada(); as sessao) {
        <div class="flex flex-wrap items-center justify-end gap-2 sm:gap-5">
          <a
            routerLink="/notas/listar"
            routerLinkActive="bg-brand-50"
            ariaCurrentWhenActive="page"
            class="inline-flex items-center gap-2 rounded-lg px-3 py-2.5 text-sm font-semibold text-brand-700 hover:bg-slate-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-700"
          >
            <svg lucideFileText class="size-4" aria-hidden="true"></svg>
            Minhas notas
          </a>
          <a
            routerLink="/categorias"
            routerLinkActive="bg-brand-50"
            ariaCurrentWhenActive="page"
            class="inline-flex items-center gap-2 rounded-lg px-3 py-2.5 text-sm font-semibold text-brand-700 hover:bg-slate-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-700"
          >
            <svg lucideTags class="size-4" aria-hidden="true"></svg>
            Minhas categorias
          </a>
          <p class="hidden text-sm text-slate-600 sm:block">
            {{ sessao.usuario.email }}
          </p>

          <button
            (click)="authService.encerrarSessao()"
            class="rounded-lg px-4 py-2.5 text-sm font-semibold text-slate-950 hover:bg-slate-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-700"
          >
            Sair
          </button>
        </div>
      } @else {
        <a
          routerLink="/auth/login"
          class="rounded-lg bg-brand-700 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-700"
          >Entrar</a
        >
      }
    </span>
  </div>
</header>
