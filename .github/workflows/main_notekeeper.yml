# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - notekeeper

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Build with dotnet
        run: dotnet build server/src/Api/NoteKeeper.Api.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish server/src/Api/NoteKeeper.Api.csproj --configuration Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  migrate:
    runs-on: windows-latest
    needs: build
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore dependencies
        run: dotnet restore server/src/Api/NoteKeeper.Api.csproj

      - name: Install Entity Framework CLI
        run: dotnet tool install --global dotnet-ef

      - name: Apply ORM migrations to AzureSQL
        env:
          SQLSERVER_CONNECTIONSTRING: ${{ secrets.SQLSERVER_CONNECTIONSTRING }}
          LuckyPenny__LicenseKey: ${{ secrets.LUCKYPENNY_LICENSE_KEY }}
        run: |
          dotnet ef database update `
            --project server/src/Infraestrutura/NoteKeeper.Infraestrutura.csproj `
            --startup-project server/src/Api/NoteKeeper.Api.csproj `
            --configuration Release `
            --connection "$env:SQLSERVER_CONNECTIONSTRING"

  deploy:
    runs-on: windows-latest
    needs: [build, migrate]
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_217C25ECFF8B4C3DB1F0FEF4BAABDC93 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_280A88E5BD724792B4DDB4BAAB66AF70 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_58425CE748E441D8BDEEF2E9E51D7468 }}

      - name: Configure Azure Web App settings
        shell: pwsh
        env:
          SQLSERVER_CONNECTIONSTRING: ${{ secrets.SQLSERVER_CONNECTIONSTRING }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          LUCKYPENNY_LICENSE_KEY: ${{ secrets.LUCKYPENNY_LICENSE_KEY }}
        run: |
          az webapp config appsettings set `
            --resource-group "notekeeper" `
            --name "notekeeper" `
            --settings `
            "ConnectionStrings__SqlServer=$env:SQLSERVER_CONNECTIONSTRING" `
            "Jwt__SigningKey=$env:JWT_SIGNING_KEY" `
            "LuckyPenny__LicenseKey=$env:LUCKYPENNY_LICENSE_KEY"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "notekeeper"
          slot-name: "Production"
          package: .
